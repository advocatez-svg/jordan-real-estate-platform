  <rect x="144" y="1054" width="1312" height="2" fill="#dce3dd"/>
  <text x="144" y="1112" fill="#173c31" font-family="Tahoma, Arial, sans-serif" font-size="30" font-weight="700">نحو 310 م² للطابق الواحد</text>
