<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">ملخص تنظيمي لأرض كوم ياجوز في شفا بدران</title>
  <desc id="desc">لوحة توضيحية تعرض المساحة والتنظيم وعدد الطوابق ونسبة البناء للأرض المعروضة.</desc>
  <rect width="1600" height="1200" fill="#ffffff"/>
  <rect x="0" y="0" width="1600" height="132" fill="#173c31"/>
  <image href="/assets/platform-logo.png" x="1360" y="28" width="76" height="76" preserveAspectRatio="xMidYMid meet"/>
  <text x="1320" y="72" fill="#ffffff" font-family="Tahoma, Arial, sans-serif" font-size="31" text-anchor="end">منصة العقارات الأردنية</text>
  <text x="1320" y="103" fill="#d6ad54" font-family="Arial, sans-serif" font-size="19" text-anchor="end">JORDAN REAL ESTATE PLATFORM</text>
  <text x="144" y="236" fill="#173c31" font-family="Tahoma, Arial, sans-serif" font-size="50" font-weight="700">كوم ياجوز - شفا بدران</text>
  <text x="144" y="285" fill="#4e615a" font-family="Tahoma, Arial, sans-serif" font-size="28">ملخص تنظيمي توضيحي للأرض المعروضة</text>
  <line x1="144" y1="328" x2="1456" y2="328" stroke="#dce3dd" stroke-width="3"/>
  <g transform="translate(144 400)">
    <rect width="650" height="570" rx="6" fill="#eef3ef" stroke="#b9c8bc" stroke-width="3"/>
    <path d="M42 122H608M42 274H608M42 426H608M210 42V528M422 42V528" stroke="#ffffff" stroke-width="18"/>
    <path d="M42 122H608M42 274H608M42 426H608M210 42V528M422 42V528" stroke="#b9c8bc" stroke-width="3"/>
    <rect x="220" y="132" width="190" height="132" rx="4" fill="#173c31"/>
    <circle cx="315" cy="168" r="20" fill="#d6ad54"/>
    <path d="M315 188L280 232H350Z" fill="#d6ad54"/>
    <text x="315" y="248" fill="#ffffff" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle">الأرض المعروضة</text>
    <text x="42" y="612" fill="#4e615a" font-family="Tahoma, Arial, sans-serif" font-size="21">تمثيل بصري للموقع والتنظيم - بلا بيانات تعريفية</text>
  </g>
  <g transform="translate(880 400)" font-family="Tahoma, Arial, sans-serif">
