    <text x="288" y="102" fill="#ffffff" font-size="48" font-weight="700" text-anchor="middle">98,000 دينار</text>
    <rect y="158" width="276" height="176" rx="6" fill="#f5f8f6" stroke="#dce3dd" stroke-width="2"/>
    <text x="138" y="212" fill="#4e615a" font-size="24" text-anchor="middle">المساحة</text>
    <text x="138" y="278" fill="#173c31" font-size="48" font-weight="700" text-anchor="middle">608 م²</text>
    <rect x="300" y="158" width="276" height="176" rx="6" fill="#f5f8f6" stroke="#dce3dd" stroke-width="2"/>
    <text x="438" y="212" fill="#4e615a" font-size="24" text-anchor="middle">التنظيم</text>
    <text x="438" y="278" fill="#173c31" font-size="48" font-weight="700" text-anchor="middle">سكن ج</text>
    <rect y="362" width="276" height="176" rx="6" fill="#f5f8f6" stroke="#dce3dd" stroke-width="2"/>
    <text x="138" y="416" fill="#4e615a" font-size="24" text-anchor="middle">البناء المسموح</text>
    <text x="138" y="482" fill="#173c31" font-size="48" font-weight="700" text-anchor="middle">4 طوابق</text>
    <rect x="300" y="362" width="276" height="176" rx="6" fill="#f5f8f6" stroke="#dce3dd" stroke-width="2"/>
    <text x="438" y="416" fill="#4e615a" font-size="24" text-anchor="middle">نسبة البناء</text>
    <text x="438" y="482" fill="#173c31" font-size="48" font-weight="700" text-anchor="middle">51%</text>
