name: Sync approved opportunities to website

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-opportunity-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check out researcher source
        uses: actions/checkout@v4
        with:
          repository: advocatez-svg/FROM-THE-FUTURE
          ref: main
          path: FROM-THE-FUTURE

      - name: Import researcher-selected opportunities
        env:
          SOURCE_REPO: ${{ github.workspace }}/FROM-THE-FUTURE
          SOURCE_REF: HEAD
        run: node tools/import-source-opportunities.mjs

      - name: Build public content
        run: node tools/build-content.mjs

      - name: Verify public content
        run: node tools/qa-content.mjs

      - name: Publish validated changes
        run: |
          if git diff --quiet -- data/opportunities-v1.json data/opportunities-meta-v1.json opportunities/index.html index.html sitemap.xml; then
            echo "No approved opportunity changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities-v1.json data/opportunities-meta-v1.json opportunities/index.html index.html sitemap.xml
          git commit -m "Sync approved opportunities from researcher source"
          git push